<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Element Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&display=swap">
  <!-- Oscuro por defecto; aplica la elección guardada antes de pintar -->
  <script>
    let t = 'dark';
    try { if (localStorage.getItem('lib-theme') === 'light') t = 'light'; } catch (e) {}
    document.documentElement.dataset.theme = t;
  </script>
  <style>
    :root {
      --bg: #ECECE8; --plate: #F7F7F4; --pearl: #DCDCD6; --rivet: #9A9A93;
      --ink: #121212; --ink-soft: #4A4A45; --frame: #121212;
      --orange: #FF5B14; --on-accent: #121212;
      --f-display: "Anton", "Arial Narrow", Impact, sans-serif;
      --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      color-scheme: light;
    }
    :root:not([data-theme="light"]) {
      --bg: #121212; --plate: #1B1B1B; --pearl: #262626; --rivet: #5E5E5A;
      --ink: #ECECE8; --ink-soft: #A9A9A2; --frame: rgba(236, 236, 232, .32);
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 400 0.9rem/1.5 var(--f-mono); }
    h1, h2 { margin: 0; font-family: var(--f-display); font-weight: 400; text-transform: uppercase; }
    p, dl, dd { margin: 0; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .wrap { max-width: 1400px; margin-inline: auto; padding: 12px; display: grid; gap: 12px; }

    .top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; padding: 18px 20px; background: var(--plate); border: 1px solid var(--frame); }
    .top h1 { font-size: clamp(2.4rem, 6vw, 4.6rem); line-height: 1; }
    .label { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
    .theme-toggle { width: 44px; height: 44px; display: grid; place-items: center; background: transparent; color: var(--ink); border: 1px solid var(--rivet); cursor: pointer; }
    .theme-toggle:hover { background: var(--ink); color: var(--plate); }

    .filters { display: flex; flex-wrap: wrap; gap: 8px 24px; }
    .group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0; padding: 0; border: 0; }
    .group legend { float: left; margin-right: 8px; padding: 0; }
    .chip { min-height: 36px; padding: 0 12px; font: 400 0.7rem/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1px solid var(--rivet); border-radius: 6px; cursor: pointer; }
    .chip[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: var(--on-accent); font-weight: 700; }

    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
    .card { border: 1.5px solid var(--frame); border-radius: 20px; padding: 5px; background: var(--plate); }
    .card-in { height: 100%; display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--frame); border-radius: 14px; }
    .head { display: flex; align-items: center; gap: 8px; }
    .id { padding: 3px 9px; border-radius: 999px; background: var(--ink); color: var(--plate); font-size: 0.7rem; font-weight: 700; }
    .status { margin-left: auto; }
    .stage { display: block; width: 100%; aspect-ratio: 16 / 10; border: 0; border-radius: 12px; background: #0A0A0A; }
    .card h2 { font-size: 1.7rem; line-height: 1.05; }
    .meta { display: grid; gap: 4px; margin-top: auto; font-size: 0.78rem; }
    .meta div { display: grid; grid-template-columns: 62px 1fr; gap: 8px; }
    .meta dt { font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); padding-top: 2px; }
    .cta {
      align-self: flex-start; min-height: 44px; padding: 0 18px; border: 0;
      background: var(--orange); color: var(--on-accent); cursor: pointer;
      font: 700 0.72rem/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
    }
    .cta:hover { background: #121212; color: var(--orange); }
    :root:not([data-theme="light"]) .cta:hover { background: #EDEDE8; color: #121212; }
    .cta:focus-visible { outline: 3px solid currentColor; outline-offset: -7px; }
    .empty { padding: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <p class="label">Local only · <span id="count"></span></p>
        <h1>Element Library</h1>
      </div>
      <button class="theme-toggle" type="button" aria-label="Switch to light theme">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 3h18L3 21Z" fill="currentColor"/></svg>
      </button>
    </header>
    <div class="filters" id="filters"></div>
    <main class="grid" id="grid" aria-live="polite"></main>
  </div>

  <script>
    // Catálogo: todo se renderiza desde elements.json
    const root = document.documentElement;
    const grid = document.getElementById('grid');
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const state = { origin: 'all', status: 'all' };
    let elements = [];

    const toggle = document.querySelector('.theme-toggle');
    const label = () => toggle.setAttribute('aria-label', `Switch to ${root.dataset.theme === 'light' ? 'dark' : 'light'} theme`);
    toggle.addEventListener('click', () => {
      root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
      try { localStorage.setItem('lib-theme', root.dataset.theme); } catch (e) {}
      label();
    });
    label();

    // Una tarjeta por elemento; la demo va en un iframe para aislar su CSS y JS
    function card(e) {
      const page = e.files.find((f) => f.endsWith('index.html'));
      return `<article class="card" data-id="${esc(e.id)}"><div class="card-in">
        <div class="head"><span class="id">${esc(e.id)}</span><span class="label">${esc(e.origin)}</span><span class="label status">${esc(e.status)}</span></div>
        <iframe class="stage" src="${esc(page)}" title="${esc(e.name)} live demo" loading="lazy"></iframe>
        <h2>${esc(e.name)}</h2>
        <p>${esc(e.description)}</p>
        <dl class="meta">
          <div><dt>Used in</dt><dd>${esc(e.usedIn)}</dd></div>
          <div><dt>Motion</dt><dd>${esc(e.motion)}</dd></div>
        </dl>
        <button class="cta" type="button" data-copy="${esc(e.id)}">Copy code</button>
      </div></article>`;
    }

    function render() {
      const list = elements.filter((e) => (state.origin === 'all' || e.origin === state.origin) && (state.status === 'all' || e.status === state.status));
      grid.innerHTML = list.length ? list.map(card).join('') : '<p class="empty">No elements match these filters.</p>';
      document.getElementById('count').textContent = `${list.length} of ${elements.length} elements`;
    }

    function filterGroup(key, title) {
      const values = ['all', ...new Set(elements.map((e) => e[key]))];
      return `<fieldset class="group"><legend class="label">${title}</legend>${values.map((v) =>
        `<button class="chip" type="button" data-key="${key}" data-value="${esc(v)}" aria-pressed="${v === 'all'}">${esc(v)}</button>`).join('')}</fieldset>`;
    }

    document.getElementById('filters').addEventListener('click', (ev) => {
      const b = ev.target.closest('.chip');
      if (!b) return;
      state[b.dataset.key] = b.dataset.value;
      document.querySelectorAll(`.chip[data-key="${b.dataset.key}"]`).forEach((c) => c.setAttribute('aria-pressed', c === b));
      render();
    });

    // Copy code: reúne todos los archivos del elemento, cada uno con su ruta
    grid.addEventListener('click', async (ev) => {
      const b = ev.target.closest('[data-copy]');
      if (!b) return;
      const e = elements.find((x) => x.id === b.dataset.copy);
      const parts = await Promise.all(e.files.map(async (f) => `/* ===== ${f} ===== */\n${await (await fetch(f)).text()}`));
      try {
        await navigator.clipboard.writeText(parts.join('\n'));
        b.textContent = 'Copied ✓';
      } catch (err) {
        b.textContent = 'Copy failed';
      }
      setTimeout(() => { b.textContent = 'Copy code'; }, 1800);
    });

    fetch('elements.json')
      .then((r) => r.json())
      .then((data) => {
        elements = data;
        document.getElementById('filters').innerHTML = filterGroup('origin', 'Origin') + filterGroup('status', 'Status');
        render();
      })
      .catch(() => { grid.innerHTML = '<p class="empty">Could not read elements.json. Open this page through the local server.</p>'; });
  </script>
</body>
</html>
