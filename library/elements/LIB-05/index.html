<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIB-05 Signal scope</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="element.css">
  <script src="element.js" defer></script>
</head>
<body>
<div class="signal-mod">
<svg class="osc" viewBox="0 0 300 200" focusable="false">
              <defs><clipPath id="osc-clip"><rect x="10" y="30" width="280" height="140" rx="8"/></clipPath></defs>
              <circle class="osc-led" cx="16" cy="13" r="4"/>
              <text class="osc-txt" x="27" y="16">RX · CH-01</text>
              <g class="osc-level"><rect x="262" y="6" width="4" height="12"/><rect x="269" y="6" width="4" height="12"/><rect x="276" y="6" width="4" height="12"/><rect x="283" y="6" width="4" height="12"/></g>
              <rect class="osc-screen" x="10" y="30" width="280" height="140" rx="8"/>
              <path class="osc-grid" d="M45 30V170M80 30V170M115 30V170M185 30V170M220 30V170M255 30V170M10 65H290M10 135H290"/>
              <path class="osc-axis" d="M150 30V170M10 100H290"/>
              <g clip-path="url(#osc-clip)"><g class="osc-wave"><path class="osc-trace" id="osc-trace"/></g></g>
              <line class="osc-cursor" x1="226" y1="34" x2="226" y2="166"/>
              <path class="osc-tag" d="M220 30H232L226 37Z"/>
              <text class="osc-txt" x="10" y="188">TIME / 20 MS</text>
              <text class="osc-txt" x="290" y="188" text-anchor="end">SIG LOCK</text>
            </svg>
<p class="label">SIGNAL / RX · Ready</p>
</div>
</body>
</html>
